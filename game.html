<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>귤이의 제주 대모험</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd2a8; font-family: system-ui, "Malgun Gothic", sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; }
  .hide { display: none !important; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  #score { position: absolute; top: 14px; left: 18px; }
  #score .big { font-size: 40px; font-weight: 800; line-height: 1; }
  #score .small { font-size: 15px; opacity: .95; margin-top: 4px; }
  #lives { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 28px; letter-spacing: 4px; }
  #combo { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 800; color: #ffe566; }
  #pw { position: absolute; top: 70px; left: 18px; display: flex; gap: 8px; flex-direction: column; font-size: 15px; }
  #pw div { background: rgba(0,0,0,.35); border-radius: 12px; padding: 3px 10px; width: fit-content; }
  #stage { position: absolute; top: 26%; left: 50%; transform: translateX(-50%); font-size: 44px; font-weight: 800; opacity: 0; white-space: nowrap; }
  #stage.show { animation: banner 2.6s ease-out; }
  @keyframes banner { 0% { opacity: 0; transform: translateX(-50%) scale(.6); } 15% { opacity: 1; transform: translateX(-50%) scale(1.1); } 75% { opacity: 1; transform: translateX(-50%) scale(1); } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; left: 50%; top: 40%; font-size: 30px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.55); animation: pop 1s ease-out forwards; white-space: nowrap; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 0) scale(.5); } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -80px) scale(1); } }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #flash.go { animation: flash .5s ease-out; }
  @keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }
  .screen { position: fixed; inset: 0; display: flex; align-items: center; padding: 0 6vw; color: #fff; background: linear-gradient(90deg, rgba(20,40,70,.62) 0%, rgba(20,40,70,.25) 55%, transparent 100%); text-shadow: 0 2px 6px rgba(0,0,0,.45); }
  .screen .box { max-width: 460px; }
  .screen h1 { font-size: clamp(34px, 6vw, 60px); margin: 0 0 6px; line-height: 1.1; }
  .screen h1 span { color: #ffb12e; }
  .screen p { margin: 6px 0; font-size: 16px; line-height: 1.5; }
  .keys { background: rgba(0,0,0,.3); border-radius: 14px; padding: 10px 16px; margin: 14px 0; font-size: 14px; line-height: 1.8; }
  kbd { background: rgba(255,255,255,.9); color: #333; border-radius: 5px; padding: 1px 7px; font-weight: 700; text-shadow: none; }
  .btn { display: inline-block; margin-top: 10px; background: linear-gradient(#ffb12e, #ff7a1a); color: #fff; font-size: 22px; font-weight: 800; border: none; border-radius: 30px; padding: 12px 34px; cursor: pointer; box-shadow: 0 6px 0 #c4550a, 0 10px 20px rgba(0,0,0,.3); text-shadow: 0 2px 2px rgba(0,0,0,.25); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c4550a; }
  #over { background: rgba(20,30,60,.55); justify-content: center; text-align: center; }
  #over .stat { font-size: 20px; margin: 4px 0; }
  #over .final { font-size: 56px; font-weight: 800; color: #ffd24a; }
  #tools { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 5; }
  #tools button, #tools a { background: rgba(0,0,0,.35); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 18px; padding: 6px 12px; font-size: 14px; cursor: pointer; text-decoration: none; }
  #tools .off { opacity: .45; text-decoration: line-through; }
  #touch { position: fixed; left: 0; right: 0; bottom: 18px; display: none; justify-content: space-between; padding: 0 18px; pointer-events: none; }
  #touch button { pointer-events: auto; border: none; border-radius: 50%; background: rgba(255,255,255,.35); color: #fff; font-size: 26px; width: 66px; height: 66px; margin: 4px; backdrop-filter: blur(4px); }
  #touch #bJump { width: 104px; height: 104px; background: rgba(255,154,31,.7); font-size: 22px; font-weight: 800; }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud" class="hide">
  <div id="score"><div class="big" id="sc">0</div><div class="small"><span id="dist">0</span> m &nbsp;·&nbsp; 🍊 <span id="coins">0</span></div></div>
  <div id="lives"></div>
  <div id="combo"></div>
  <div id="pw"></div>
  <div id="stage"></div>
</div>
<div id="pops"></div>
<div id="flash"></div>

<div id="menu" class="screen">
  <div class="box">
    <h1>귤이의<br><span>제주 대모험</span></h1>
    <p>🍊 폴짝폴짝 뛰며 한라산 아래 제주를 달려요!<br>감귤을 모으고, 돌담과 돌하르방을 피하고, 바다 틈을 뛰어넘으세요.</p>
    <div class="keys">
      <kbd>Space</kbd> 또는 <kbd>↑</kbd> 점프 (공중에서 한 번 더 = 2단 점프, 오래 누르면 더 높이)<br>
      <kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>A</kbd> <kbd>D</kbd> 왼쪽·오른쪽 길 옮기기<br>
      <kbd>M</kbd> 음악 &nbsp; <kbd>V</kbd> 음성 &nbsp; <kbd>P</kbd> 일시정지
    </div>
    <p>🔊 음성과 효과음이 나와요. 소리를 켜 주세요!</p>
    <button class="btn" id="start">▶ 모험 시작</button>
    <p style="font-size:14px;opacity:.9;margin-top:14px">🏆 최고 기록 <b id="best0">0</b></p>
  </div>
</div>

<div id="over" class="screen hide">
  <div class="box">
    <h1>게임 오버!</h1>
    <div class="final" id="fScore">0</div>
    <div class="stat">달린 거리 <b id="fDist">0</b> m &nbsp;·&nbsp; 🍊 <b id="fCoins">0</b>개</div>
    <div class="stat" id="fBest"></div>
    <button class="btn" id="retry">↻ 다시 도전</button>
  </div>
</div>

<div id="tools">
  <button id="bMusic" title="배경음악 (M)">🎵</button>
  <button id="bVoice" title="음성 (V)">🗣️</button>
  <a href="index.html">홈</a>
</div>
<div id="touch">
  <div><button id="bUp">◀</button><button id="bDown">▶</button></div>
  <button id="bJump">점프</button>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- game constants ----------
const L = 6;                       // length of one road row (run direction = +x)
const LANES = [-2.2, 0, 2.2];      // z positions of the 3 lanes
const AHEAD = 38, BEHIND = 6, STAGE_LEN = 900;
const GRAV = 40, JUMP_V = 14, JUMP2_V = 12.5, BASE_SPEED = 15;

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffd2a8, 100, 650);
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 1600);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.45, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 90 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.05;
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x6a8a6a, 0.6);
scene.add(sun, sun.target, hemi);

// ---------- themes: 아침 → 한낮 → 노을 → 밤 ----------
const TH = [
  { name: '🌅 아침의 한라산', say: '맑은 아침이에요', top: '#6fb7e8', bot: '#ffd2a8', sun: '#ffd9a0', sunI: 1.7, hemi: .55, sea: '#47b9c9', cloud: '#fff1e0', night: 0 },
  { name: '☀️ 눈부신 한낮 바다', say: '눈부신 한낮이에요', top: '#3d9be0', bot: '#bfe6f5', sun: '#fff6e0', sunI: 2.0, hemi: .65, sea: '#2fb3c8', cloud: '#ffffff', night: 0 },
  { name: '🌇 제주의 노을', say: '노을이 정말 예뻐요', top: '#6a4fa0', bot: '#ff8a5c', sun: '#ff9a60', sunI: 1.5, hemi: .5, sea: '#c4607a', cloud: '#ffb59a', night: 0 },
  { name: '🌙 별빛 가득한 밤', say: '별이 반짝이는 밤이에요', top: '#050824', bot: '#1b2a5a', sun: '#cfd8ff', sunI: .6, hemi: .4, sea: '#0f3f6a', cloud: '#3a456e', night: 1 }
].map(t => ({ ...t, top: new THREE.Color(t.top), bot: new THREE.Color(t.bot), sun: new THREE.Color(t.sun), sea: new THREE.Color(t.sea), cloud: new THREE.Color(t.cloud) }));
const cur = { top: new THREE.Color(), bot: new THREE.Color(), sun: new THREE.Color(), sea: new THREE.Color(), cloud: new THREE.Color(), sunI: 1, hemi: .5, night: 0 };

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: cur.top }, bottom: { value: cur.bot } },
  vertexShader: 'varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying float h; void main(){ gl_FragColor = vec4(mix(bottom, top, smoothstep(0., .55, h)), 1.); }'
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 24, 16), skyMat); sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);

const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(22, 20, 14), new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false }));
scene.add(sunDisc);

const starGeo = new THREE.BufferGeometry(), sp = new Float32Array(900 * 3);
for (let i = 0; i < 900; i++) {
  const v = new V3().randomDirection(); v.y = Math.abs(v.y) * 0.9 + 0.08; v.normalize().multiplyScalar(900);
  sp.set([v.x, v.y, v.z], i * 3);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
const starMat = new THREE.PointsMaterial({ size: 2.4, sizeAttenuation: false, color: 0xffffff, transparent: true, opacity: 0, fog: false, depthWrite: false });
const stars = new THREE.Points(starGeo, starMat); stars.frustumCulled = false; scene.add(stars);

// ---------- sea ----------
const h2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vn(x, y, p) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const g = (a, b) => h2(((a % p) + p) % p, ((b % p) + p) % p);
  return (g(xi, yi) * (1 - u) + g(xi + 1, yi) * u) * (1 - v) + (g(xi, yi + 1) * (1 - u) + g(xi + 1, yi + 1) * u) * v;
}
const waterTex = (() => {
  const S = 256, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'), img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let n = 0, a = 0.5, f = 8;
    for (let o = 0; o < 3; o++) { n += a * vn(x / S * f, y / S * f, f); f *= 2; a *= 0.5; }
    const v = Math.min(255, Math.floor(n * 300)); img.data.set([v, v, v, 255], (y * S + x) * 4);
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(300, 200); return t;
})();
const seaMat = new THREE.MeshPhysicalMaterial({ color: '#2fb3c8', roughness: 0.15, metalness: 0, bumpMap: waterTex, bumpScale: 0.6 });
const sea = new THREE.Mesh(new THREE.PlaneGeometry(2400, 1600).rotateX(-Math.PI / 2), seaMat);
sea.position.y = -1.5; sea.receiveShadow = true; scene.add(sea);

// ---------- 한라산 backdrop ----------
const mountain = (() => {
  const g = new THREE.CylinderGeometry(0.07, 1, 1, 72, 28, true), p = g.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), h = y + 0.5, a = Math.atan2(z, x);
    const b = 1 + 0.08 * Math.sin(a * 7) + 0.05 * Math.sin(a * 13 + h * 4) + 0.04 * Math.sin(h * 18 + a * 3);
    p.setXYZ(i, x * b, y, z * b);
    c.set(h < 0.3 ? '#4f8f3c' : h < 0.58 ? '#6b8f46' : h < 0.82 ? '#8a8071' : '#f4f7fb');
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: false }));
  m.scale.set(200, 110, 200); scene.add(m); return m;
})();

// ---------- clouds ----------
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
const clouds = [];
for (let i = 0; i < 9; i++) {
  const g = new THREE.Group(), s = rand(3, 6);
  for (let k = 0; k < 6; k++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(rand(.6, 1.1) * s, 12, 8), cloudMat);
    m.position.set(rand(-1.4, 1.4) * s, rand(-.2, .4) * s, rand(-.6, .6) * s); g.add(m);
  }
  g.position.set(i * 70, rand(30, 55), rand(-260, -70)); scene.add(g); clouds.push(g);
}

// ---------- geometry helpers (vertex-coloured, merged) ----------
function part(geo, hex, x = 0, y = 0, z = 0) {
  geo.translate(x, y, z);
  const c = new THREE.Color(hex), n = geo.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(a, 3)); return geo;
}
const merge = list => mergeGeometries(list.map(g => g.index ? g.toNonIndexed() : g));
const B = THREE.BoxGeometry, S = THREE.SphereGeometry, CYL = THREE.CylinderGeometry, CONE = THREE.ConeGeometry;

// road row: asphalt + grass shoulders + 돌담 + lane dashes
const roadGeo = (() => {
  const parts = [part(new B(L, .8, 7.6), '#3d3f46', 0, -.4, 0), part(new B(L, .8, 6), '#5d9d45', 0, -.55, -6.8), part(new B(L, .8, 6), '#5d9d45', 0, -.55, 6.8)];
  const r = mulberry32(3);
  for (const side of [-1, 1]) for (let k = -1; k <= 1; k++) {
    const h = .5 + r() * .3; parts.push(part(new B(L / 3 - .06, h, .9), r() > .5 ? '#2d2d33' : '#3b3b42', k * L / 3, h / 2, side * 3.95));
  }
  for (const z of [-1.1, 1.1]) parts.push(part(new B(1.6, .02, .14), '#e8e8e0', 0, .01, z));
  return merge(parts);
})();
const roadMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95 });
const decorMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .9 });

const treeGeo = (() => {
  const p = [part(new CYL(.12, .16, 1, 8), '#6b4a2b', 0, .5, 0), part(new S(.9, 14, 10).scale(1, .85, 1), '#2f7a34', 0, 1.6, 0)];
  const r = mulberry32(11);
  for (let i = 0; i < 7; i++) { const a = r() * TAU, y = 1.3 + r() * .7; p.push(part(new S(.13, 8, 6), '#ff8c1a', Math.cos(a) * .85 * (1 - (y - 1.6) ** 2), y, Math.sin(a) * .85 * (1 - (y - 1.6) ** 2))); }
  return merge(p);
})();
const palmGeo = (() => {
  const p = [part(new CYL(.1, .17, 3.2, 8), '#9b7a4d', 0, 1.6, 0)];
  for (let k = 0; k < 6; k++) p.push(part(new CONE(.22, 1.9, 4).translate(0, .95, 0).rotateZ(-1.15).rotateY(k * TAU / 6), '#3f9a45', 0, 3.2, 0));
  return merge(p);
})();
const canolaGeo = (() => {
  const p = [part(new B(2.6, .08, 2.6), '#4d8f3a', 0, .04, 0)], r = mulberry32(7);
  for (let i = 0; i < 22; i++) p.push(part(new B(.18, .5, .18), '#f6d51f', (r() - .5) * 2.3, .3, (r() - .5) * 2.3));
  return merge(p);
})();
const houseGeo = merge([part(new B(2.2, 1.1, 1.8), '#5e5e66', 0, .55, 0), part(new CONE(1.9, 1.1, 4).rotateY(Math.PI / 4).scale(1, 1, .9), '#d8bb6a', 0, 1.65, 0), part(new B(.4, .7, .05), '#5a3b22', 0, .35, .92)]);
const rockGeo = merge([part(new THREE.IcosahedronGeometry(.9, 0).scale(1, .7, .9), '#3a3a40', 0, .4, 0), part(new THREE.IcosahedronGeometry(.4, 0), '#46464d', 1.1, .2, .3)]);

function makeTurbine() {
  const g = new THREE.Group(), white = new THREE.MeshStandardMaterial({ color: '#f2f4f5', roughness: .5 });
  const t = new THREE.Mesh(new CYL(.08, .16, 7, 10), white); t.position.y = 3.5; t.castShadow = true; g.add(t);
  const rotor = new THREE.Group(); rotor.position.set(0, 7, .3); g.add(rotor);
  for (let k = 0; k < 3; k++) {
    const h = new THREE.Group(); h.rotation.z = k * TAU / 3;
    const b = new THREE.Mesh(new B(.16, 3.2, .04), white); b.position.y = 1.6; b.castShadow = true; h.add(b); rotor.add(h);
  }
  g.userData.rotor = rotor; return g;
}

// ---------- entity models ----------
const itemMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .35, emissive: '#777777', emissiveIntensity: 1 });
const tangMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .35, emissive: '#ff7a00', emissiveIntensity: 2.0 });
const goldMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .25, metalness: .5, emissive: '#ffb000', emissiveIntensity: 2.6 });
const tangGeo = merge([part(new S(.28, 14, 10), '#ff9a1f'), part(new CONE(.06, .14, 5), '#4caf50', 0, .3, 0), part(new S(.07, 6, 4).scale(1.8, .3, .9), '#4caf50', .08, .3, 0)]);
const wallGeo = merge([part(new B(1.1, .55, 1.7), '#2f2f35', 0, .275, 0), part(new B(.95, .35, 1.45), '#3a3a41', .03, .72, .05), part(new B(.7, .22, 1.2), '#2a2a30', -.05, .99, -.04),
  part(new B(.35, .3, .5), '#47474f', .3, .6, .6), part(new B(.35, .3, .5), '#414148', -.3, .6, -.6), part(new S(.25, 6, 5).scale(1.4, .5, 1.2), '#4f8f3c', .05, 1.1, .2)]);

const SCALE = [293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 784];

function playStep(dt) {
  const pIdx = Math.floor(P.x / L), diffSpeed = Math.min(15, P.x / 170), boosting = P.boost > 0;

    if (P.y === 0) P.coyote = .1;

  if (boosting) burst(P.x - .4, P.y + .5, P.z, 3, Math.random() < .5 ? '#ffd24a' : '#ff7a1a', 2, { up: 0, grav: 0, life: .45 });

    if (row.rotor) row.rotor.rotation.z -= dt * 2;
    const near = idx >= pIdx - 2 && idx <= pIdx + 3;
    for (const e of row.ents) {
      if (e.dead) continue;
      const o = e.obj;
      if (e.kind === 'coin' || e.kind === 'gold') { o.rotation.y += dt * 3; if (!(P.magnet > 0 && near)) o.position.y = e.baseY + Math.sin(time * 3 + e.ph) * .08; }
      else if (e.kind === 'crab') { o.position.z = e.baseZ + Math.sin(time * e.sp + e.ph) * 2.2; o.rotation.y = Math.PI / 2 * Math.sign(Math.cos(time * e.sp + e.ph)); }
      else if (e.kind === 'magnet' || e.kind === 'shield' || e.kind === 'boost') { o.rotation.y += dt * 2.5; o.position.y = e.baseY + Math.sin(time * 3 + e.ph) * .15; }

        if (o.position.distanceTo(center) < (e.kind === 'gold' ? 1.1 : .8)) { e.dead = true; scene.remove(o); collectCoin(e); }
      } else if (e.kind === 'magnet' || e.kind === 'shield' || e.kind === 'boost') {

          if (e.kind === 'magnet') { P.magnet = 9; pop('🧲 자석!', '#ff8a8a'); say('자석 발동!', { pitch: 1.9 }); }
          else if (e.kind === 'shield') { P.shield = true; pop('🛡️ 방패!', '#9fe0ff'); say('방패 장착!', { pitch: 1.9 }); }
          else { P.boost = 5; pop('🚀 부스트!', '#ffe566'); say('부스트! 달려요!', { pitch: 1.9 }); }
        }
      } else if (Math.abs(dx) < e.hx + .38 && Math.abs(dz) < e.hz + .3 && P.y < e.h - .05 && !e.dead) {
        if (boosting) { e.dead = true; scene.remove(o); sfx.smash(); P.score += 50; shake = Math.max(shake, .25); burst(o.position.x, o.position.y + .6, o.position.z, 30, '#bbbbbb', 7, { up: 4, life: .6 }); pop('💥 박살! +50', '#ffe566'); }
        else if (P.inv <= 0) {
          if (P.shield) { P.shield = false; P.inv = 1.2; sfx.hit(); shake = .3; burst(P.x, P.y + .6, P.z, 40, '#4fc3f7', 8, { up: 3, life: .6 }); pop('🛡️ 방패가 막았어요!', '#9fe0ff'); say('방패가 막았어요!', { pitch: 1.9 }); }
          else { hurt(e.kind === 'crab' ? '🦀 앗, 게다!' : '💢 쿵!', '아야!'); P.speed *= .6; }
        }
      }
    }
  }
  applyTheme(); ensureRows(); updateHUD();
}

function updateCamera(dt) {
  let pos, look, fov = 58;
  if (state === 'menu') {
    pos = new V3(P.x + 2.4, 1.7 + Math.sin(time * .6) * .1, 4.6); look = new V3(P.x - .9, 1, 0);
  } else {
    const boostF = P.boost > 0 ? 10 : 0; fov = 58 + clamp((P.speed - BASE_SPEED) * .35, 0, 8) + boostF;
    // behind-and-above chase camera: left/right on screen = the 3 lanes
    pos = new V3(P.x - 6.5, 4.8 + Math.max(0, P.y) * .3, P.z * .6); look = new V3(P.x + 9, 1 + Math.max(0, P.y) * .2, P.z * .6);
  }
  const k = 1 - Math.exp(-dt * (state === 'menu' ? 3 : 7));
  camera.position.x = state === 'menu' ? lerp(camera.position.x, pos.x, k) : pos.x;
  camera.position.y = lerp(camera.position.y, pos.y, k); camera.position.z = lerp(camera.position.z, pos.z, k);
  if (shake > 0) { camera.position.x += rand(-1, 1) * shake * .5; camera.position.y += rand(-1, 1) * shake * .5; shake = Math.max(0, shake - dt * 2); }
  camera.fov = lerp(camera.fov, fov, Math.min(1, dt * 4)); camera.updateProjectionMatrix();
  camera.lookAt(look);
}

// ---------- main loop ----------
resetWorld(); applyTheme();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) {
    time += dt;
    if (state === 'play') playStep(dt);
    else if (state === 'over') { P.speed = lerp(P.speed, 0, Math.min(1, dt * 2.5)); P.x += P.speed * dt; P.vy -= GRAV * dt; P.y = Math.max(0, P.y + P.vy * dt); if (P.y === 0) P.vy = 0; ensureRows(); }
    else { // menu: idle hop
      const c = (time % 1.6) / 1.6, hop = c < .45 ? Math.sin(c / .45 * Math.PI) * 1.1 : 0;
      P.y = hop; P.vy = c < .45 ? Math.cos(c / .45 * Math.PI) * 5 : 0; P.speed = 0; P.z = 0;
    }
    updateParticles(dt);
  }
  updateEnvironment(paused ? 0 : dt); updateHero(paused ? 0 : dt); updateCamera(dt);
  composer.render();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
