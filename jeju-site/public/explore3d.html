<style>
  :root { --bg:#0d1b2a; --panel:rgba(10,22,38,.88); --line:rgba(255,255,255,.16); --text:#eef4ff; --muted:#a9bad0; --gold:#ffb12e; --teal:#42d6c0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; }
  #side { position:fixed; top:12px; left:12px; width:290px; max-height:calc(100% - 24px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; backdrop-filter:blur(8px); z-index:5; }
  #side h1 { font-size:18px; margin:0 0 4px; }
  #side h1 span { color:var(--gold); }
  #side .sub { margin:0 0 10px; font-size:12px; color:var(--muted); line-height:1.5; }
  #side a.back { color:var(--teal); font-size:13px; text-decoration:none; }
  #side h2 { font-size:13px; margin:14px 0 6px; color:var(--gold); }
  .layers label { display:flex; align-items:center; gap:8px; font-size:14px; padding:4px 0; cursor:pointer; }
  .layers input { accent-color:var(--gold); width:16px; height:16px; }
  .layers .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .layers label.off { opacity:.45; cursor:not-allowed; }
  .list { display:flex; flex-direction:column; gap:3px; }
  .list button { text-align:left; background:transparent; border:1px solid transparent; color:var(--text); padding:6px 8px; border-radius:8px; font:inherit; font-size:13px; cursor:pointer; }
  .list button:hover { background:rgba(255,255,255,.08); border-color:var(--line); }
  .list .grp { font-size:11px; color:var(--muted); margin:8px 0 2px; }
  .btns { display:flex; gap:6px; margin-top:10px; }
  .btn { flex:1; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:999px; padding:7px 10px; font:inherit; font-size:13px; cursor:pointer; }
  .btn:hover { background:var(--gold); color:#2a1400; border-color:var(--gold); }
  .help { margin-top:12px; font-size:12px; color:var(--muted); line-height:1.6; }
  #toggle-side { display:none; position:fixed; top:12px; left:12px; z-index:6; }
  #info { position:fixed; right:12px; top:12px; width:310px; max-height:calc(100% - 24px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; backdrop-filter:blur(8px); z-index:5; }

  #info .vis { margin-top:6px; padding-top:10px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  #info .vis b { color:var(--text); }
  #info svg { width:100%; height:64px; display:block; margin-top:8px; }
  .label { background:rgba(8,20,35,.8); color:#fff; padding:2px 9px; border-radius:999px; font-size:12px; line-height:1.5; white-space:nowrap; border:1px solid rgba(255,255,255,.35); cursor:pointer; pointer-events:auto; user-select:none; }
  .label:hover { background:var(--gold); color:#2a1400; }
  .label.spot { border-color:#ffb12e; } .label.port { border-color:#5db7ff; } .label.olle { border-color:#42d6c0; }
  .label.orchard { border-color:#ff9a2e; } .label.wind { border-color:#e6eef8; }
  #credit { position:fixed; bottom:8px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--muted); background:rgba(8,20,35,.6); padding:3px 12px; border-radius:999px; z-index:4; white-space:nowrap; max-width:96vw; overflow:hidden; text-overflow:ellipsis; }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:var(--bg); z-index:20; font-size:16px; text-align:center; padding:20px; }
  #loading small { color:var(--muted); font-size:13px; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ================= 좌표 =================
// 1 칸 = 1 km. 위·경도를 평면(x: 동쪽, z: 남쪽)으로 바꿔요.
const LON0 = 126.55, LAT0 = 33.37;
const toXZ = (lon, lat) => [(lon - LON0) * 92.9, (LAT0 - lat) * 111.2];
const E = 2.2; // 높이 과장 배율

// 제주섬 해안선(개략)
const COAST = [
  [126.54, 33.52], [126.62, 33.53], [126.70, 33.55], [126.80, 33.56], [126.88, 33.53], [126.94, 33.47],
  [126.94, 33.41], [126.88, 33.35], [126.80, 33.31], [126.70, 33.26], [126.60, 33.24], [126.50, 33.23],
  [126.40, 33.21], [126.31, 33.20], [126.22, 33.22], [126.17, 33.28], [126.16, 33.35], [126.19, 33.43],
  [126.26, 33.49], [126.35, 33.51], [126.44, 33.50],
].map(([a, b]) => toXZ(a, b));

function inPoly(x, z) {
  let c = false;
  for (let i = 0, j = COAST.length - 1; i < COAST.length; j = i++) {
    const [xi, zi] = COAST[i], [xj, zj] = COAST[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) c = !c;
  }
  return c;
}
function distCoast(x, z) {
  let m = 1e9;
  for (let i = 0, j = COAST.length - 1; i < COAST.length; j = i++) {
    const [ax, az] = COAST[j], [bx, bz] = COAST[i];
    const dx = bx - ax, dz = bz - az;
    const t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1);
    const d = Math.hypot(x - (ax + t * dx), z - (az + t * dz));
    if (d < m) m = d;
  }
  return m;
}
const signedD = (x, z) => (inPoly(x, z) ? 1 : -1) * distCoast(x, z);

// ================= 난수 / 잡음 =================
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash2 = (i, j) => { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, z) {
  const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  return hash2(i, j) * (1 - u) * (1 - v) + hash2(i + 1, j) * u * (1 - v) + hash2(i, j + 1) * (1 - u) * v + hash2(i + 1, j + 1) * u * v;
}

// ================= 지형 높이 =================
const HAL = toXZ(126.5312, 33.3617); // 한라산(백록담)
const rng = mulberry32(20261029);
const OREUM = [];
(function makeOreum() {
  let n = 0, guard = 0;
  while (n < 130 && guard++ < 4000) {
    const x = (rng() - 0.5) * 80, z = (rng() - 0.5) * 50;
    if (distCoast(x, z) < 1.4 || !inPoly(x, z)) continue;
    if (Math.hypot(x - HAL[0], z - HAL[1]) < 4) continue;
    OREUM.push({ x, z, h: 0.07 + rng() * 0.3, r: 0.5 + rng() * 0.9 });
    n++;
  }
  const [sx, sz] = toXZ(126.314, 33.2392); OREUM.push({ x: sx, z: sz, h: 0.4, r: 0.75 });   // 산방산
  const [ix, iz] = toXZ(126.9425, 33.458); OREUM.push({ x: ix, z: iz, h: 0.2, r: 0.8 });    // 성산일출봉
})();

function heightKm(x, z, d) {
  if (d <= 0) return -Math.min(0.25, -d * 0.03);
  const dx = (x - HAL[0]) * 0.85, dz = z - HAL[1];
  const r = Math.hypot(dx, dz);
  let h = 0.03 + 0.1 * smooth(0, 6, d);
  h += 1.9 * Math.pow(Math.max(0, 1 - r / 21), 2.0);
  h += 0.05 * Math.exp(-Math.pow((r - 0.55) / 0.22, 2));         // 분화구 둘레
  if (r < 0.55) h -= 0.13 * (1 - (r / 0.55) * (r / 0.55));       // 백록담
  for (const o of OREUM) {
    const q = ((x - o.x) * (x - o.x) + (z - o.z) * (z - o.z)) / (o.r * o.r);
    if (q < 9) h += o.h * Math.exp(-q);
  }
  h += (vnoise(x * 0.9, z * 0.9) - 0.5) * 0.05 + (vnoise(x * 3, z * 3) - 0.5) * 0.015;
  return h * smooth(0, 2.2, d) + 0.01;
}
const groundY = (x, z) => Math.max(0, heightKm(x, z, signedD(x, z))) * E;
const groundLL = (lon, lat) => { const [x, z] = toXZ(lon, lat); return new THREE.Vector3(x, groundY(x, z), z); };

// 감귤 재배지(남쪽 사면의 밭 구획)
function orchardParcel(x, z, d, h) {
  if (z < 6 || d < 0.8 || h < 0.03 || h > 0.6) return false;
  return hash2(Math.floor(x / 0.45), Math.floor(z / 0.45)) < 0.6;
}

const ITEMS = [

  { id: 'seongsan', cat: 'spot', name: '성산일출봉', lon: 126.9425, lat: 33.458, desc: '바닷속 화산이 폭발해 생긴 봉우리예요. 해돋이 명소로 유명하고 유네스코 세계자연유산이에요.' },
  { id: 'manjang', cat: 'spot', name: '만장굴', lon: 126.7714, lat: 33.5283, desc: '용암이 흐르며 만든 세계적인 용암동굴이에요. 길이가 7km가 넘고 일부만 개방해요.' },
  { id: 'yongdu', cat: 'spot', name: '용두암', lon: 126.5117, lat: 33.516, desc: '용이 머리를 들고 하늘로 오르려는 모습을 닮은 바위예요. 용암이 식으며 만들어졌어요.' },
  { id: 'bijarim', cat: 'spot', name: '비자림', lon: 126.8085, lat: 33.4903, desc: '수백 년 된 비자나무가 모여 있는 숲이에요. 천천히 걸으며 숲 내음을 맡기 좋아요.' },
  { id: 'hyeopjae', cat: 'spot', name: '협재해수욕장', lon: 126.2395, lat: 33.394, desc: '에메랄드빛 바다와 하얀 모래가 아름다운 해변이에요. 바다 건너로 비양도가 보여요.' },
  { id: 'sanbang', cat: 'spot', name: '산방산', lon: 126.314, lat: 33.2392, desc: '종 모양으로 솟은 암산이에요. 전설에 따르면 설문대할망이 한라산 꼭대기를 던져 생겼다고 해요.', vkey: '산방산_용머리' },
  { id: 'jusang', cat: 'spot', name: '중문·대포 주상절리대', lon: 126.4251, lat: 33.2377, desc: '용암이 식으며 기둥 모양으로 갈라진 해안 절벽이에요. 파도가 칠 때 특히 멋져요.', vkey: '중문대포 주상절리대' },

const NX = 360, NZ = 230, W = 92, D = 60;
let terrain, colA, colB, colorAttr;

function buildTerrain() {
  const geo = new THREE.PlaneGeometry(W, D, NX, NZ);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const n = pos.count;
  colA = new Float32Array(n * 3); // 기본 색
  colB = new Float32Array(n * 3); // 감귤밭 강조 색
  const cSand = new THREE.Color(0xe6d7a3), cLow = new THREE.Color(0x6fae52), cMid = new THREE.Color(0x4a8a3c);
  const cHigh = new THREE.Color(0x2f6a35), cRock = new THREE.Color(0x7a6a58), cTop = new THREE.Color(0xb9b2a5);
  const cSea = new THREE.Color(0x2a7a8c), cDeep = new THREE.Color(0x14405e), cBasalt = new THREE.Color(0x4b4d4f);
  const cField = new THREE.Color(0x9fbf45), cFieldB = new THREE.Color(0xc9a93a);
  const c = new THREE.Color(), c2 = new THREE.Color();

  for (let i = 0; i < n; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const d = signedD(x, z);
    const h = heightKm(x, z, d);
    pos.setY(i, h * E);
    if (d <= 0) {
      c.copy(cSea).lerp(cDeep, smooth(0, 8, -d));
      c.toArray(colA, i * 3); c.toArray(colB, i * 3);
      continue;
    }
    if (h < 0.25) c.copy(cLow).lerp(cMid, h / 0.25);
    else if (h < 0.8) c.copy(cMid).lerp(cHigh, (h - 0.25) / 0.55);
    else if (h < 1.3) c.copy(cHigh).lerp(cRock, (h - 0.8) / 0.5);
    else c.copy(cRock).lerp(cTop, clamp((h - 1.3) / 0.6, 0, 1));
    const nz = vnoise(x * 2.3, z * 2.3);
    c.multiplyScalar(0.92 + nz * 0.16);
    c.lerp(cSand, (1 - smooth(0.05, 0.6, d)) * 0.9);
    if (d < 1.2 && vnoise(x * 5, z * 5) > 0.62) c.lerp(cBasalt, 0.6 * (1 - smooth(0.2, 1.2, d)));
    c.toArray(colA, i * 3);
    if (orchardParcel(x, z, d, h)) {
      c2.copy(hash2(Math.floor(x / 0.45) + 7, Math.floor(z / 0.45)) > 0.5 ? cField : cFieldB);
      c.lerp(c2, 0.78);
    }
    c.toArray(colB, i * 3);
  }
  colorAttr = new THREE.BufferAttribute(new Float32Array(colB), 3);
  geo.setAttribute('color', colorAttr);
  geo.computeVertexNormals();
  terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
  scene.add(terrain);
}

let orchardTrees;
function buildOrchard() {
  const tr = [];
  const rnd = mulberry32(77);
  for (let x = -34; x < 34; x += 0.17) {
    for (let z = 5.8; z < 17; z += 0.17) {
      const px = x + (rnd() - 0.5) * 0.06, pz = z + (rnd() - 0.5) * 0.06;
      const d = signedD(px, pz);
      const h = heightKm(px, pz, d);
      if (!orchardParcel(px, pz, d, h)) continue;
      if (rnd() > 0.55) continue;
      tr.push([px, h * E, pz]);
      if (tr.length >= 6000) break;
    }
    if (tr.length >= 6000) break;
  }
  const leaf = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.075, 0), new THREE.MeshStandardMaterial({ color: 0x2f7a2f, roughness: 0.9, flatShading: true }), tr.length);
  const fruit = new THREE.InstancedMesh(new THREE.SphereGeometry(0.03, 6, 5), new THREE.MeshStandardMaterial({ color: 0xff9a1f, emissive: 0x7a3a00, roughness: 0.6 }), tr.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  tr.forEach(([x, y, z], i) => {
    s.setScalar(0.8 + ((i * 37) % 10) / 25);
    m.compose(p.set(x, y + 0.06, z), q, s); leaf.setMatrixAt(i, m);
    m.compose(p.set(x + 0.04, y + 0.1, z + 0.035), q, new THREE.Vector3(1, 1, 1)); fruit.setMatrixAt(i, m);
  });
  leaf.frustumCulled = false; fruit.frustumCulled = false;
  orchardTrees = new THREE.Group();
  orchardTrees.add(leaf, fruit);
  scene.add(orchardTrees);
}

const runners = [];

function buildTrails() {
  const mat = new THREE.MeshStandardMaterial({ color: 0x42d6c0, emissive: 0x1c9c8a, emissiveIntensity: 0.8, roughness: 0.5 });
  Object.entries(TRAILS).forEach(([id, pts]) => {
    const curve2 = new THREE.CatmullRomCurve3(pts.map(([lo, la]) => { const [x, z] = toXZ(lo, la); return new THREE.Vector3(x, 0, z); }));
    const samples = curve2.getPoints(160).map((v) => new THREE.Vector3(v.x, Math.max(0.05, groundY(v.x, v.z)) + 0.05, v.z));
    const curve = new THREE.CatmullRomCurve3(samples);
    trailGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 200, 0.03, 6, false), mat));
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    trailGroup.add(dot);
    runners.push({ dot, curve, t: Math.random(), speed: 0.012 + Math.random() * 0.01 });
  });
  scene.add(trailGroup);
}

const turbines = [];

function buildWind() {
  const towerM = new THREE.MeshStandardMaterial({ color: 0xf2f5f8, roughness: 0.6 });
  ITEMS.filter((i) => i.cat === 'wind').forEach((item, k) => {
    for (let n = 0; n < 4; n++) {
      const lon = item.lon + (n % 2) * 0.012 - 0.006 + (k * 0.001), lat = item.lat + Math.floor(n / 2) * 0.012 - 0.006;
      const p = groundLL(lon, lat);
      if (p.y <= 0.001 && signedD(p.x, p.z) < 0.3) continue;
      const g = new THREE.Group();
      const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.03, 0.45, 8), towerM); tower.position.y = 0.225;
      const hub = new THREE.Group(); hub.position.set(0, 0.46, 0.03);
      for (let b = 0; b < 3; b++) {
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.24, 0.006), towerM);
        const arm = new THREE.Group(); arm.rotation.z = (b * Math.PI * 2) / 3; blade.position.y = 0.12; arm.add(blade); hub.add(arm);
      }
      g.add(tower, hub);
      g.position.copy(p);
      g.rotation.y = -0.6; // 북서풍을 맞는 방향
      windGroup.add(g);
      turbines.push(hub);
    }
  });
  scene.add(windGroup);
}

const weatherGroup = new THREE.Group();
const clouds = [];
let streaks, streakData;
function buildWeather() {
  const cm = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
  const r2 = mulberry32(5);
  for (let i = 0; i < 12; i++) {
    const g = new THREE.Group();
    const parts = 5 + Math.floor(r2() * 4);
    for (let p = 0; p < parts; p++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.9 + r2() * 1.2, 8, 6), cm);
      s.position.set((p - parts / 2) * 1.3, r2() * 0.5, (r2() - 0.5) * 1.6); s.scale.y = 0.55; g.add(s);
    }
    g.position.set((r2() - 0.5) * 120, 6 + r2() * 4, (r2() - 0.5) * 60);
    g.userData.v = 0.5 + r2() * 0.6;
    weatherGroup.add(g); clouds.push(g);
  }
  const N = 240;
  streaks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.7, 0.012, 0.012), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 }), N);
  streakData = Array.from({ length: N }, () => ({ x: (r2() - 0.5) * 100, y: 1 + r2() * 5, z: (r2() - 0.5) * 62, v: 3 + r2() * 3 }));
  streaks.frustumCulled = false;
  weatherGroup.add(streaks);
  weatherGroup.visible = false;
  scene.add(weatherGroup);
}

const visGroup = new THREE.Group();

const VKEYS = ITEMS.filter((i) => i.vkey);
function loadVisitors() {
  try { const raw = sessionStorage.getItem('visitors:v1'); if (raw) visRows = JSON.parse(raw); } catch { /* 없으면 막대 없이 */ }
  if (!visRows || !visRows.length) { visRows = null; return; }
  const last = visRows[visRows.length - 1];
  const max = Math.max(...VKEYS.map((i) => last[i.vkey] || 0), 1);
  VKEYS.forEach((item) => {
    const v = last[item.vkey] || 0;
    const h = 0.4 + (v / max) * 4;
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, h, 12), new THREE.MeshStandardMaterial({ color: 0xff5d8f, emissive: 0xaa2a55, emissiveIntensity: 0.5, transparent: true, opacity: 0.72 }));
    m.position.set(item.pos.x + 0.4, item.pos.y + h / 2, item.pos.z);
    visGroup.add(m);
  });
  scene.add(visGroup);
}

    const bw = 100 / rows.length;
    v.hidden = false;
    v.innerHTML = `${last.year}년 ${last.month}월 관람객 <b>${(last[item.vkey] || 0).toLocaleString('ko-KR')}명</b>
      <svg viewBox="0 0 100 40" preserveAspectRatio="none">${rows.map((r, i) => { const h = ((r[item.vkey] || 0) / mx) * 36; return `<rect x="${i * bw + 0.8}" y="${40 - h}" width="${bw - 1.6}" height="${h}" rx="1" fill="${i === rows.length - 1 ? '#ffb12e' : '#42d6c0'}"/>`; }).join('')}</svg>
      <div style="margin-top:4px">최근 12개월 · 출처 공공데이터포털(서귀포시)</div>`;
  } else v.hidden = true;
  ring.visible = true;
  ring.position.set(item.pos.x, item.pos.y + 0.03, item.pos.z);
  if (doFly) flyTo(item.pos, item.cat === 'spot' && item.id === 'hallasan' ? 14 : 5);
  updateLabels();
}
$('#info-x').onclick = () => { $('#info').hidden = true; selected = null; ring.visible = false; updateLabels(); };
$('#info-fly').onclick = () => selected && flyTo(selected.pos, 4);
$('#reset').onclick = () => { fly = { t0: performance.now(), dur: 1600, fromT: controls.target.clone(), fromP: camera.position.clone(), toT: HOME.target.clone(), toP: HOME.pos.clone() }; };
$('#spin').onclick = (e) => { controls.autoRotate = !controls.autoRotate; e.currentTarget.textContent = controls.autoRotate ? '회전 멈춤' : '자동 회전'; };
$('#toggle-side').onclick = () => $('#side').classList.toggle('closed');
if (innerWidth <= 720) $('#side').classList.add('closed');

// ================= 애니메이션 =================
const clock = new THREE.Clock();
const dummy = new THREE.Object3D();
const seaPos = seaGeo.attributes.position;
let frame = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  frame++;

  if (fly) {
    const k = clamp((performance.now() - fly.t0) / fly.dur, 0, 1);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    controls.target.lerpVectors(fly.fromT, fly.toT, e);
    camera.position.lerpVectors(fly.fromP, fly.toP, e);
    if (k >= 1) fly = null;
  }
  controls.update();
  camDist = camera.position.distanceTo(controls.target);

  // 바다 물결
  for (let i = 0; i < seaPos.count; i++) {
    const x = seaBase[i * 3], z = seaBase[i * 3 + 2];
    seaPos.setY(i, Math.sin(x * 0.35 + t * 1.2) * 0.03 + Math.cos(z * 0.3 + t * 0.9) * 0.025);
  }
  seaPos.needsUpdate = true;

  // 마커 크기(멀리서도 보이게)
  const s = clamp(camDist / 28, 0.45, 3.2);
  pins.forEach((p) => p.group.scale.setScalar(s));
  ring.scale.setScalar(s * (1 + Math.sin(t * 4) * 0.12));
  if (frame % 8 === 0) updateLabels();

  // 올레길 달리는 점
  runners.forEach((r) => { r.t = (r.t + r.speed * dt) % 1; r.dot.position.copy(r.curve.getPoint(r.t)).y += 0.05; r.dot.scale.setScalar(s * 0.7); });
  // 풍력 날개
  turbines.forEach((h) => { h.rotation.z -= dt * 1.6; });
  // 어선
  boats.forEach((b) => {
    b.a += b.w * dt * 0.5;
    const x = b.c.x + Math.cos(b.a) * b.r, z = b.c.z + Math.sin(b.a) * b.r;
    b.g.position.set(x, 0.03 + Math.sin(t * 2 + b.a) * 0.012, z);
    b.g.rotation.y = -b.a + (b.w > 0 ? -Math.PI / 2 : Math.PI / 2);
    b.g.scale.setScalar(Math.max(1, s * 0.9));
  });
  // 구름·바람
  if (weatherGroup.visible) {
    clouds.forEach((c) => { c.position.x += c.userData.v * dt; if (c.position.x > 70) c.position.x = -70; });
    streakData.forEach((d, i) => {
      d.x += d.v * dt; if (d.x > 52) d.x = -52;
      dummy.position.set(d.x, d.y, d.z); dummy.rotation.set(0, 0.35, 0); dummy.updateMatrix(); streaks.setMatrixAt(i, dummy.matrix);
    });
    streaks.instanceMatrix.needsUpdate = true;
  }
  visGroup.children.forEach((m, i) => { m.material.opacity = 0.62 + Math.sin(t * 2 + i) * 0.1; });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

// ================= 시작 =================
window.__jejuOk = true;
requestAnimationFrame(() => setTimeout(() => {
  buildTerrain();
  buildOrchard();
  buildMarkers();
  buildTrails();
  buildWind();
  buildBoats();
  buildWeather();
  loadVisitors();
  buildUI();
  applyLayers();
  animate();
  $('#loading').classList.add('done');
  const q = new URLSearchParams(location.search).get('go');
  const target = ITEMS.find((i) => i.id === q);
  if (target) select(target, true);
}, 40));
</script>
