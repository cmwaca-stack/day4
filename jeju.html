  #nav button:hover, #ctl button:hover { background: rgba(255,255,255,.32); }

<body>
<div id="title" class="panel"><b>🌋 제주도</b><span>Jeju Island · 돌 · 바람 · 감귤의 섬</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V3 = THREE.Vector3, TAU = Math.PI * 2;

// ---------- renderer / scene (same set-up as the threejs keyframes example) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5aa8e6'); gr.addColorStop(0.55, '#cfe8ef'); gr.addColorStop(1, '#cfe8ef');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
scene.fog = new THREE.Fog(0xcfe8ef, 70, 230);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 900);
camera.position.set(0, 16, 42);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 140;
controls.maxPolarAngle = Math.PI * 0.495;

const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.set(30, 35, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 120 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun, new THREE.HemisphereLight(0xbfe3ff, 0x6a8a6a, 0.5));

// ---------- island height field ----------
const A = 30, B = 18;
const OREUMS = [[-14, 6, .9], [-18, -2, .7], [10, 9, .8], [16, -5, .9], [-6, -10, .7], [22, 4, .6], [4, -12, .8], [-22, 8, .6]];
const sstep = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
function height(x, z) {
  const d = Math.hypot(x / A, z / B);
  let h = -1 + 2.1 * sstep(1.02, 0.5, d) - 2.2 * sstep(0.95, 1.2, d);
  h += 6.4 * Math.exp(-(x * x / (2 * 6.5 * 6.5) + z * z / (2 * 4.5 * 4.5)));   // 한라산
  h -= 1.4 * Math.exp(-(x * x + z * z) / 2);                                  // 백록담 화구
  for (const [ox, oz, oh] of OREUMS) h += oh * Math.exp(-((x - ox) ** 2 + (z - oz) ** 2) / (2 * 1.5 * 1.5)); // 오름
  return h + 0.07 * Math.sin(x * 0.9 + 1.3) * Math.cos(z * 1.1) + 0.04 * Math.sin(x * 2.3 + z * 1.7);
}

const STOPS = [[-3.2, '#12485a'], [-0.8, '#2f8f9d'], [-0.08, '#e3d7a8'], [0.05, '#3a3a3f'], [0.3, '#4a4a50'],
  [0.5, '#79b25a'], [2.6, '#4f8f3c'], [4.3, '#5f7d3f'], [5.3, '#7d7468'], [7.6, '#a59d92']].map(([h, c]) => [h, new THREE.Color(c)]);
function terrainColor(h, out) {
  if (h <= STOPS[0][0]) return out.copy(STOPS[0][1]);
  for (let i = 1; i < STOPS.length; i++) if (h <= STOPS[i][0]) {
    const [h0, c0] = STOPS[i - 1], [h1, c1] = STOPS[i];
    return out.copy(c0).lerp(c1, (h - h0) / (h1 - h0));
  }
  return out.copy(STOPS[STOPS.length - 1][1]);
}

{
  const g = new THREE.PlaneGeometry(76, 50, 300, 200); g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = height(x, z);
    pos.setY(i, h);
    terrainColor(h, c);
    const v = 1 + (0.1 * Math.sin(x * 3.1) * Math.sin(z * 2.7) + 0.06 * Math.sin(x * 7 + z * 5)) * sstep(-1, 0, h);
    c.multiplyScalar(v);
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const terrain = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  terrain.castShadow = terrain.receiveShadow = true;
  scene.add(terrain);
}

// 백록담
const lake = new THREE.Mesh(new THREE.CircleGeometry(0.62, 28), new THREE.MeshStandardMaterial({ color: 0x3aa0d0, roughness: 0.1 }));
lake.rotation.x = -Math.PI / 2; lake.position.y = height(0, 0) + 0.22; scene.add(lake);

// ---------- sea ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#12485a', roughness: 1 }));
floor.position.y = -3.25; scene.add(floor);

const h2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vn(x, y, p) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const g = (a, b) => h2(((a % p) + p) % p, ((b % p) + p) % p);
  return (g(xi, yi) * (1 - u) + g(xi + 1, yi) * u) * (1 - v) + (g(xi, yi + 1) * (1 - u) + g(xi + 1, yi + 1) * u) * v;
}
const waterTex = (() => {
  const S = 256, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'), img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let n = 0, a = 0.5, f = 8;
    for (let o = 0; o < 3; o++) { n += a * vn(x / S * f, y / S * f, f); f *= 2; a *= 0.5; }
    const v = Math.min(255, Math.floor(n * 300));
    img.data.set([v, v, v, 255], (y * S + x) * 4);
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(150, 150); return t;
})();
const sea = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200).rotateX(-Math.PI / 2),
  new THREE.MeshPhysicalMaterial({ color: '#3fb6c4', transparent: true, opacity: 0.72, roughness: 0.12, metalness: 0, bumpMap: waterTex, bumpScale: 0.5 }));
sea.receiveShadow = true; scene.add(sea);

// ---------- helpers ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(2024);
const dummy = new THREE.Object3D();
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });

// ---------- keyframe animation (THREE.AnimationMixer + KeyframeTracks) ----------
const mixers = [];
function play(root, tracks, duration) {
  const m = new THREE.AnimationMixer(root);
  m.clipAction(new THREE.AnimationClip('clip', duration, tracks)).play();
  mixers.push(m);
}
// fn(u) -> Vector3 for u in [0,1] (periodic); builds position (+ heading) keyframes along that path
function followPath(root, fn, duration, { steps = 120, heading = true, roll = () => 0 } = {}) {
  const times = [], p = [], q = [];
  for (let i = 0; i <= steps; i++) {
    const u = i / steps, a = fn(u);
    times.push(u * duration); p.push(a.x, a.y, a.z);
    if (heading) {
      dummy.position.copy(a); dummy.rotation.set(0, 0, 0); dummy.lookAt(fn(u + 0.002)); dummy.rotateZ(roll(u));
      q.push(dummy.quaternion.x, dummy.quaternion.y, dummy.quaternion.z, dummy.quaternion.w);
    }
  }
  const tracks = [new THREE.VectorKeyframeTrack('.position', times, p)];
  if (heading) tracks.push(new THREE.QuaternionKeyframeTrack('.quaternion', times, q));
  play(root, tracks, duration);
}

// ---------- locations ----------
const STATUE = new V3(-6, 0, 11); STATUE.y = height(STATUE.x, STATUE.z);
const TURBINES = [[19, 6], [18.5, -1], [18, -6]].map(([x, z]) => new V3(x, height(x, z) - 0.1, z));

// ---------- 감귤나무 & 유채꽃 ----------
const trees = [];
for (let tries = 0; trees.length < 240 && tries < 6000; tries++) {
  const x = -22 + rng() * 44, z = 1.5 + rng() * 11, h = height(x, z);
  if (h < 0.4 || h > 1.9) continue;
  if (Math.hypot(x - STATUE.x, z - STATUE.z) < 2) continue;
  if (TURBINES.some(t => Math.hypot(x - t.x, z - t.z) < 1.2)) continue;
  trees.push(new V3(x, h, z));
}
{
  const N = trees.length;
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.03, 0.04, 0.3, 6), std('#6b4a2b'), N);
  const canopy = new THREE.InstancedMesh(new THREE.SphereGeometry(0.26, 10, 8), std('#2f7a34', { roughness: 0.9 }), N);
  const fruit = new THREE.InstancedMesh(new THREE.SphereGeometry(0.06, 8, 6), std('#ff8c1a', { roughness: 0.45, emissive: '#ff6a00', emissiveIntensity: 0.15 }), N * 4);
  canopy.castShadow = true;
  trees.forEach((t, i) => {
    const s = 0.8 + rng() * 0.5;
    dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(s);
    dummy.position.set(t.x, t.y + 0.1 * s, t.z); dummy.updateMatrix(); trunks.setMatrixAt(i, dummy.matrix);
    dummy.position.set(t.x, t.y + 0.38 * s, t.z); dummy.updateMatrix(); canopy.setMatrixAt(i, dummy.matrix);
    for (let k = 0; k < 4; k++) {
      const a = rng() * TAU, r = 0.2 * s;
      dummy.position.set(t.x + Math.cos(a) * r, t.y + (0.3 + rng() * 0.2) * s, t.z + Math.sin(a) * r);
      dummy.scale.setScalar(s); dummy.updateMatrix(); fruit.setMatrixAt(i * 4 + k, dummy.matrix);
    }
  });
  scene.add(trunks, canopy, fruit);
}
{
  const patches = [];
  for (let tries = 0; patches.length < 36 && tries < 4000; tries++) {
    const x = -24 + rng() * 48, z = -14 + rng() * 28, h = height(x, z);
    if (h > 0.3 && h < 0.7) patches.push(new V3(x, h, z));
  }
  const canola = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), std('#f4d21f', { emissive: '#a88800', emissiveIntensity: 0.25 }), patches.length);
  patches.forEach((p, i) => {
    dummy.position.set(p.x, p.y + 0.12, p.z); dummy.rotation.set(0, rng() * Math.PI, 0); dummy.scale.setScalar(0.7 + rng() * 0.7);
    dummy.updateMatrix(); canola.setMatrixAt(i, dummy.matrix);
  });
  canola.receiveShadow = true; scene.add(canola);
}

// ---------- 돌하르방 ----------
{
  const stone = std('#5b5855', { roughness: 1 }), dark = std('#1c1c1c');
  const g = new THREE.Group();
  const add = (m, parent = g) => { m.castShadow = true; parent.add(m); return m; };
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.38, 0.9, 18), stone)).position.y = 0.45;
  const head = new THREE.Group(); head.position.y = 0.9; g.add(head);
  const skull = add(new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 16), stone), head); skull.scale.set(1, 1.05, 0.95); skull.position.y = 0.32;
  const hat = add(new THREE.Mesh(new THREE.SphereGeometry(0.37, 20, 10, 0, TAU, 0, Math.PI / 2), stone), head); hat.scale.set(1, 0.8, 1); hat.position.y = 0.43;
  for (const s of [-1, 1]) add(new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 8), dark), head).position.set(s * 0.13, 0.34, 0.29);
  const nose = add(new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), stone), head); nose.scale.set(1.2, 1, 0.8); nose.position.set(0, 0.25, 0.32);
  add(new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.016, 0.02), dark), head).position.set(0, 0.13, 0.32);
  const hand1 = add(new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.22, 4, 8), stone)); hand1.rotation.z = 1.1; hand1.position.set(-0.1, 0.62, 0.3);
  const hand2 = add(new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.22, 4, 8), stone)); hand2.rotation.z = -1.3; hand2.position.set(0.12, 0.46, 0.32);
  g.position.copy(STATUE); g.scale.setScalar(1.3); g.rotation.y = 0.3;
  scene.add(g);
  play(head, [new THREE.NumberKeyframeTrack('.rotation[x]', [0, 1.5, 3], [0, 0.07, 0])], 3);
}

// ---------- 풍력발전기 ----------
TURBINES.forEach((pos, i) => {
  const white = std('#f2f4f5', { roughness: 0.5 }), g = new THREE.Group();
  const add = m => { m.castShadow = true; g.add(m); return m; };
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 3.4, 12), white)).position.y = 1.7;
  add(new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.4), white)).position.y = 3.4;
  const rotor = new THREE.Group(); rotor.position.set(0, 3.4, 0.25); g.add(rotor);
  rotor.add(new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 8), white));
  for (let k = 0; k < 3; k++) {
    const holder = new THREE.Group(); holder.rotation.z = k * TAU / 3;
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.07, 1.5, 0.015), white); blade.position.y = 0.75; blade.castShadow = true;
    holder.add(blade); rotor.add(holder);
  }
  g.position.copy(pos); scene.add(g);
  const T = 4.5 + i * 1.0, times = [0, .25, .5, .75, 1].map(f => f * T), q = new THREE.Quaternion(), vals = [];
  times.forEach((_, k) => { q.setFromAxisAngle(new V3(0, 0, 1), -k * Math.PI / 2); vals.push(q.x, q.y, q.z, q.w); });
  play(rotor, [new THREE.QuaternionKeyframeTrack('.quaternion', times, vals)], T);
});

// ---------- 갈치잡이 어선 ----------
const boats = [];
function makeBoat() {
  const g = new THREE.Group(), white = std('#f4f4f4', { roughness: 0.5 });
  const add = m => { m.castShadow = true; g.add(m); return m; };
  add(new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.28, 1.7), white)).position.y = 0.12;
  const bow = add(new THREE.Mesh(new THREE.ConeGeometry(0.53, 0.8, 4).rotateY(Math.PI / 4), white));
  bow.rotation.x = Math.PI / 2; bow.scale.set(1, 1, 0.37); bow.position.set(0, 0.12, 1.25);
  add(new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.3, 0.5), std('#ff7a3d'))).position.set(0, 0.4, -0.3);
  add(new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.03, 0.03), std('#444'))).position.set(0, 0.75, 0.25);
  const lamp = new THREE.MeshBasicMaterial({ color: 0xfff4b0 });
  for (let k = -2; k <= 2; k++) { const l = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), lamp); l.position.set(k * 0.2, 0.7, 0.25); g.add(l); }
  scene.add(g); return g;
}
[[38, 25, 1, 0, 90], [44, 30, -1, 0.3, 120], [34, 22, 1, 0.6, 80]].forEach(([rx, rz, dir, ph, T]) => {
  const boat = makeBoat(); boats.push(boat);
  followPath(boat, u => { const a = TAU * (dir * u + ph); return new V3(Math.cos(a) * rx, 0.08 + Math.sin(TAU * 5 * u) * 0.05, Math.sin(a) * rz); },
    T, { steps: 180, roll: u => Math.sin(TAU * 3 * u) * 0.06 });
});

// ---------- 갈매기 ----------
function makeBird() {
  const g = new THREE.Group(), white = std('#ffffff', { roughness: 0.6 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), white); body.scale.set(0.8, 0.7, 2.2); body.castShadow = true; g.add(body);
  const wings = [-1, 1].map(s => {
    const pivot = new THREE.Group(), w = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.015, 0.16), white);
    w.position.x = s * 0.25; pivot.add(w); g.add(pivot); return { pivot, s };
  });
  scene.add(g); return { g, wings };
}
for (let i = 0; i < 5; i++) {
  const { g, wings } = makeBird(), R = 15 + i * 1.3, ph = i * 0.17, T = 22 + i * 3;
  followPath(g, u => { const a = TAU * (u + ph); return new V3(Math.cos(a) * R * 1.5, 8 + 1.3 * Math.sin(TAU * 2 * u + i), Math.sin(a) * R * 0.9); },
    T, { steps: 160, roll: () => 0.25 });
  const flap = 0.55 + i * 0.03;
  wings.forEach(({ pivot, s }) => play(pivot, [new THREE.NumberKeyframeTrack('.rotation[z]', [0, flap / 2, flap], [0.5 * -s, -0.5 * -s, 0.5 * -s])], flap));
}

// ---------- 구름 (한라산 모자구름 포함) ----------
function makeCloud(size) {
  const g = new THREE.Group(), m = std('#ffffff', { roughness: 1 });
  for (let k = 0; k < 6; k++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry((0.6 + rng() * 0.5) * size, 14, 10), m);
    s.position.set((rng() - 0.5) * 2.6 * size, (rng() - 0.3) * 0.4 * size, (rng() - 0.5) * 1.2 * size);
    s.castShadow = true; g.add(s);
  }
  scene.add(g); return g;
}
[[24, 11, 1, 0, 120, 1.4], [28, 12.5, -1, 0.4, 140, 1.8], [20, 10, 1, 0.7, 100, 1.2], [26, 13, -1, 0.15, 160, 1.6], [3.6, 6.5, 1, 0, 50, 0.7]]
  .forEach(([R, y, dir, ph, T, size]) => followPath(makeCloud(size),
    u => { const a = TAU * (dir * u + ph); return new V3(Math.cos(a) * R * 1.4, y + Math.sin(TAU * 2 * u) * 0.4, Math.sin(a) * R); },
    T, { steps: 90, heading: false }));

// ---------- camera spots ----------
const centroid = pts => pts.reduce((s, p) => s.add(p), new V3()).multiplyScalar(1 / pts.length);
const TREE_C = centroid(trees), TURB_C = centroid(TURBINES);
const SPOTS = [
  { name: '전체', desc: '<b>제주도</b><br>화산 활동으로 만들어진 섬. 한가운데 한라산이 솟아 있고 주변에 크고 작은 오름이 펼쳐집니다.', get: () => ({ pos: new V3(0, 16, 42), target: new V3(0, 1, 0) }) },
  { name: '한라산', desc: '<b>한라산</b><br>해발 1,947m, 남한에서 가장 높은 산. 정상에는 화구호 백록담이 있습니다.', get: () => ({ pos: new V3(-10, 9.5, 15), target: new V3(0, 5, 0) }) },
  { name: '돌하르방', desc: '<b>돌하르방</b><br>검은 현무암으로 만든 제주의 상징. 마을 입구를 지키는 수호신입니다.', get: () => ({ pos: STATUE.clone().add(new V3(2.2, 1.2, 3.6)), target: STATUE.clone().add(new V3(0, 1, 0)) }) },
  { name: '감귤·유채', desc: '<b>감귤밭과 유채꽃</b><br>겨울엔 주황빛 감귤이 익고, 봄엔 노란 유채꽃이 섬을 물들입니다.', get: () => ({ pos: TREE_C.clone().add(new V3(6, 4.5, 10)), target: TREE_C.clone() }) },
  { name: '풍력발전기', desc: '<b>풍력 발전</b><br>돌·바람·여자가 많아 삼다도라 불리는 제주. 거센 바람으로 전기를 만듭니다.', get: () => ({ pos: TURB_C.clone().add(new V3(9, 3.5, 6)), target: TURB_C.clone().add(new V3(0, 2, 0)) }) },
  { name: '어선', follow: true, desc: '<b>갈치잡이 어선</b><br>밤이면 집어등을 환하게 켜고 바다를 밝히는 제주의 어선입니다.', get: () => ({ pos: boats[0].position.clone().add(new V3(5, 3, 6)), target: boats[0].position.clone().add(new V3(0, 0.5, 0)) }) }
];
const nav = document.getElementById('nav'), info = document.getElementById('info');
let goal = null;
SPOTS.forEach((s, i) => {
  const b = document.createElement('button'); b.textContent = s.name;
  b.onclick = () => { [...nav.children].forEach(c => c.classList.toggle('on', c === b)); info.innerHTML = s.desc; goal = s; };
  nav.appendChild(b);
});
nav.firstChild.click(); goal = null;
controls.addEventListener('start', () => { goal = null; });

let paused = false;
const pauseBtn = document.getElementById('pause');
pauseBtn.onclick = () => { paused = !paused; pauseBtn.textContent = paused ? '▶ 재생' : '⏸ 일시정지'; };

// ---------- loop ----------
const clock = new THREE.Clock(); let wt = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!paused) {
    mixers.forEach(m => m.update(dt));
    wt += dt; waterTex.offset.set(wt * 0.004, wt * 0.002);
  }
  if (goal) {
    const { pos, target } = goal.get(), k = 1 - Math.exp(-dt * 3);
    camera.position.lerp(pos, k); controls.target.lerp(target, k);
    if (!goal.follow && camera.position.distanceTo(pos) < 0.05) goal = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
