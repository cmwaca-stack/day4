  extra(s) { s.pick = () => { if (s.picking) return; s.picking = true; let r = Math.random(), k = 0; for (; k < 4; k++) { r -= s.probs[k]; if (r <= 0) break; } const b = s.bars[k], w = CANDS[s.set][k][0]; b.jump = 1.5; burst(b.m.position.x, b.hp + 1, 0, 40, PAL[k], 6); const from = new V3(b.m.position.x, b.hp + 2, 0);
      later(() => { s.addWord(w, PAL[k], from); if (s.set >= CANDS.length - 1) { later(() => { s.words.slice(1).forEach(x => s.sent.remove(x)); s.words.length = 1; s.x = s.words[0].userData.w + .35; s.set = 0; s.refresh(); s.picking = false; }, 2200); burst(0, 7, 0, 90, '#ffd23f', 9); } else { s.set++; s.refresh(); s.picking = false; } }, 700); }; } });

// 7. training
SC.push({ title: '7. 어떻게 똑똑해졌을까?', cam: { p: [0, 4.5, 18], l: [0, 3, 0] },
  lines: ['AI는 어떻게 이렇게 똑똑해졌을까? 책을 <b>엄청, 엄청 많이</b> 읽었어! 📚', '책을 읽다가 일부러 빈칸을 두고 맞혀 봐. <b>"엄마가 ___를 먹어요"</b>', '틀리면 정답을 알려 줘. 그러면 머릿속 작은 <b>다이얼(숫자 손잡이)</b>을 살짝 돌려서 고쳐! 점점 맞히는 게 늘어나지?', '이걸 <b>수천억 번</b> 반복하면 정말 말을 잘하게 돼. 이게 바로 <b>딥러닝(깊은 공부)</b>이야!', '그 다음엔 사람과 대화하는 연습을 더 해서 <b>친절하고 도움이 되는</b> AI 친구가 되는 거야 💖'],
  build(g) { const r = makeRobot(); r.position.set(0, 3.2, 0); r.scale.setScalar(1.1); g.add(r);
    const knobs = Array.from({ length: 8 }, (_, i) => { const k = new THREE.Group(), a = i / 8 * TAU, m = new THREE.Mesh(new THREE.CylinderGeometry(.45, .45, .3, 20), new THREE.MeshStandardMaterial({ color: PAL[i % 6], roughness: .3 })); m.rotation.x = Math.PI / 2; k.add(m); const n = new THREE.Mesh(new THREE.BoxGeometry(.08, .4, .08), new THREE.MeshBasicMaterial({ color: '#fff' })); n.position.set(0, .15, .2); k.add(n); k.position.set(Math.cos(a) * 5.6, 3.4 + Math.sin(a) * 3.2, -1); k.scale.setScalar(.001); g.add(k); return k; });
    const quiz = label('엄마가 ____ 를 먹어요', 1.3, { color: '#2b2b4a', bg: '#fff' }); quiz.position.set(0, 7.9, 0); quiz.scale.multiplyScalar(.001); g.add(quiz); const wrong = label('자동차? ❌', 1, { color: '#fff', bg: '#ff5a6a' }), right = label('정답: 밥! ✅', 1, { color: '#fff', bg: '#3ac27a' }), hello = label('안녕! 무엇을 도와줄까? 😊', 1.1, { color: '#4a3a9a', bg: '#fff' }), cnt = label('1번', 1.4, { color: '#e0306a', bg: '#fff0f5' });
    wrong.position.set(5, 5.6, 0); right.position.set(5, 5.6, 0); hello.position.set(0, 7.6, 0); cnt.position.set(0, 0.2, 2); [wrong, right, hello, cnt].forEach(l => { l.scale.multiplyScalar(.001); g.add(l); });
    const bgb = new THREE.Mesh(new THREE.BoxGeometry(8, .5, .5), new THREE.MeshStandardMaterial({ color: '#e0daf5' })); bgb.position.set(0, -.4, 3); g.add(bgb); const fill = new THREE.Mesh(new THREE.BoxGeometry(8, .5, .55), new THREE.MeshStandardMaterial({ color: '#5fd39a', emissive: '#5fd39a', emissiveIntensity: .3 })); fill.position.set(-4, -.4, 3); fill.scale.x = .02; g.add(fill);
    return { r, knobs, quiz, wrong, right, hello, cnt, fill, books: [], bt: 0, reading: true, acc: .05, accT: .05, phase: 0, counter: 0 }; },
  phase(i, s) { s.phase = i; if (i === 0) { s.reading = true; s.r.userData.setMood('think'); } if (i === 1) { s.reading = false; T(s.quiz, { s: 1 }); later(() => { T(s.wrong, { s: 1 }); s.r.userData.setMood('sad'); burst(5, 5.6, 0, 30, '#ff5a6a', 4); }, 1800); later(() => { T(s.wrong, { s: .001 }); T(s.right, { s: 1 }); s.r.userData.setMood('happy'); burst(5, 5.6, 0, 40, '#3ac27a', 5); }, 4800); }
    if (i === 2) { T(s.quiz, { s: .001 }); T(s.right, { s: .001 }); s.knobs.forEach((k, n) => later(() => T(k, { s: 1 }), n * 150)); s.accT = .6; s.r.userData.setMood('think'); }
    if (i === 3) { s.accT = .97; T(s.cnt, { s: 1 }); s.counter = 1; s.r.userData.setMood('happy'); }
    if (i === 4) { s.knobs.forEach(k => T(k, { s: .001 })); T(s.cnt, { s: .001 }); T(s.hello, { s: 1 }); burst(0, 7, 0, 80, '#ff8fab', 8); } },
  update(dt, t, s) { s.r.userData.anim(t, dt); s.r.position.y = 3.2 + Math.sin(t * 2) * .1; s.acc = lerp(s.acc, s.accT, Math.min(1, dt * 1.2)); s.fill.scale.x = Math.max(.01, s.acc); s.fill.position.x = -4 + 4 * s.acc;
    if (s.reading) { s.bt -= dt; if (s.bt <= 0) { s.bt = .4; const m = new THREE.Mesh(new THREE.BoxGeometry(1, .15, .75), new THREE.MeshStandardMaterial({ color: PAL[Math.floor(rand(0, 6))], roughness: .5 })); m.userData = { u: 0, a: rand(0, TAU), r: rand(11, 15) }; s.books.push(m); s.r.parent.add(m); } }
    for (let i = s.books.length - 1; i >= 0; i--) { const b = s.books[i], d = b.userData; d.u += dt * .7; const k = d.u, rr = d.r * (1 - k); b.position.set(Math.cos(d.a) * rr, 3.2 + (1 - k) * (2 + Math.sin(d.a * 3) * 2) + Math.sin(k * Math.PI) * 2.5, Math.sin(d.a) * rr * .6 + 1); b.rotation.set(k * 6, k * 4, 0); b.scale.setScalar(1 - k * .7); if (k >= 1) { burst(0, 3.2, 1, 6, '#ffd23f', 2, .6); b.parent.remove(b); s.books.splice(i, 1); } }
    s.knobs.forEach((k, i) => { k.rotation.z = Math.sin(t * (.6 + i * .15) + i) * (1.2 * (1 - s.acc * .6)); });
    if (s.counter) { s.counter += dt; const stages = ['1번', '100번', '10,000번', '1,000,000번', '수천억 번!!'], idx = Math.min(4, Math.floor(s.counter / .9)); if (s.cnt.userData.t !== stages[idx]) { s.cnt.userData.t = stages[idx]; setLabel(s.cnt, stages[idx], { color: '#e0306a', bg: '#fff0f5' }); burst(0, 0.8, 2, 20, '#ffd23f', 4); } } } });

// 8. wrap up
SC.push({ title: '8. 정리해 볼까?', cam: { p: [0, 5, 19], l: [0, 3.3, 0] },
  lines: ['정리해 볼까? 글을 <b>조각내고</b>, <b>숫자로 바꾸고</b>, <b>뜻 나라</b>에 앉히고, 서로 <b>쳐다보게</b> 하고, <b>층층이</b> 이해한 다음, <b>다음 말을 뽑아서</b> 대답해!', 'ChatGPT도, Gemini도, Claude도 모두 이 <b>트랜스포머</b> 원리를 써. 크기와 연습량이 다를 뿐이야.', '하지만 AI도 가끔은 <b>틀린 말을 그럴듯하게</b> 해! 중요한 건 꼭 <b>확인</b>하고, 어른이나 책에도 물어보자 🔎', '끝까지 들어 줘서 고마워! 이제 너도 <b>AI의 비밀</b>을 아는 친구야! 🎉'],
  build(g) { const steps = [['✂️', '조각내기'], ['🔢', '숫자로'], ['🗺️', '뜻 나라'], ['👀', '쳐다보기'], ['🏢', '층층이'], ['🎲', '다음 말'], ['💬', '대답!']], cards = steps.map(([e, n], i) => { const c = new THREE.Group(), m = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.4, .35), new THREE.MeshStandardMaterial({ color: PAL[i % 6], roughness: .4, emissive: PAL[i % 6], emissiveIntensity: 0 })); c.add(m); const em = label(e, 1.5, { size: 110, pad: 4 }); em.position.set(0, .55, .3); c.add(em); const nm = label(n, .7, { color: '#fff', size: 70, stroke: 'rgba(0,0,0,.3)', pad: 6 }); nm.position.set(0, -.95, .3); c.add(nm);
      c.position.set((i - 3) * 3.1, 3.4, 0); c.scale.setScalar(.001); popIn(c); g.add(c); c.userData.m = m; return c; }); const arrows = []; for (let i = 0; i < 6; i++) { const a = label('➜', .8, { color: '#4a3a9a', size: 80, pad: 0 }); a.position.set((i - 3) * 3.1 + 1.55, 3.4, 0); g.add(a); }
    const r = makeRobot(); r.position.set(0, 9, 0); r.scale.setScalar(.6); g.add(r); return { cards, r, lit: -1, tt: 0, fw: false, ft: 0 }; },
  phase(i, s) { if (i === 0) { s.tt = 0; s.lit = -1; } if (i === 3) { s.fw = true; s.r.userData.setMood('wow'); } },
  update(dt, t, s) { s.r.userData.anim(t, dt); s.r.position.y = 9 + Math.sin(t * 2) * .15; s.tt += dt; if (s.lit < 6 && s.tt > .8 + (s.lit + 1) * .9) { s.lit++; const c = s.cards[s.lit]; c.userData.m.material.emissiveIntensity = .5; T(c, { s: 1.18, k: 6 }); burst(c.position.x, 3.4, 1, 24, PAL[s.lit % 6], 5); }
    if (s.fw) { s.ft -= dt; if (s.ft <= 0) { s.ft = .35; burst(rand(-12, 12), rand(6, 14), rand(-4, 2), 50, pick(PAL), 9, 1.4); } } } });
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

// ---------- player (timeline) ----------
let si = -1, li = 0, lt = 0, S = null, cur = null, grp = null, paused = false, auto = true, voiceOn = true, started = false, endT = 0;
const camP = new V3(0, 3, 15), camL = new V3(0, 2, 0), camPT = new V3(), camLT = new V3(), clock = new THREE.Clock();
let koVoice = null; function pickVoice() { try { koVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('ko')) || null; } catch (e) {} } if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) { if (!voiceOn || !('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g, '').replace(/[🎲👋🔢🧩🤔✨🌈💖🔎🎉📚💕👀💭]/gu, '')); u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; u.pitch = 1.5; u.rate = .98; speechSynthesis.speak(u); } catch (e) {} }
const plain = h => h.replace(/<[^>]+>/g, '');
const dur = i => Math.max(3.4, plain(S.lines[i]).length * .2 + 1.6);
function goScene(n) {
  timers.forEach(clearTimeout); timers = []; tw.clear(); if (grp) { scene.remove(grp); } try { speechSynthesis.cancel(); } catch (e) {} $('s6').classList.add('hide'); endT = 0;
  si = clamp(n, 0, SC.length - 1); S = SC[si]; grp = new THREE.Group(); scene.add(grp); cur = S.build(grp); if (S.extra) S.extra(cur); camPT.set(...S.cam.p); camLT.set(...S.cam.l); cur.orbit = !!S.cam.orbit; cur.oa = 0;
  $('sceneName').textContent = S.title; [...$('dots').children].forEach((d, k) => d.className = k === si ? 'on' : k < si ? 'done' : ''); showLine(0);
}
function showLine(i) { li = i; lt = 0; $('line').innerHTML = S.lines[i]; S.phase(i, cur); say(S.lines[i]); }
function nextLine() { if (li < S.lines.length - 1) showLine(li + 1); else if (si < SC.length - 1) goScene(si + 1); }
SC.forEach((_, k) => { const d = document.createElement('i'); d.onclick = () => started && goScene(k); $('dots').appendChild(d); });
$('prev').onclick = () => goScene(si - 1); $('next').onclick = () => goScene(si + 1); $('skip').onclick = nextLine;
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? '▶ 계속' : '⏸ 멈춤'; if (paused) { try { speechSynthesis.cancel(); } catch (e) {} } else say(S.lines[li]); };
$('vbtn').onclick = () => { voiceOn = !voiceOn; $('vbtn').classList.toggle('off', !voiceOn); $('vbtn').textContent = voiceOn ? '🔊 목소리' : '🔇 목소리'; if (!voiceOn) try { speechSynthesis.cancel(); } catch (e) {} else say(S.lines[li]); };
$('pickb').onclick = () => { if (S && S.ui6 && cur.enabled) cur.pick(); };
$('go').onclick = () => { $('start').classList.add('hide'); started = true; goScene(0); };
addEventListener('keydown', e => { if (!started) return; if (e.code === 'ArrowRight') goScene(si + 1); else if (e.code === 'ArrowLeft') goScene(si - 1); else if (e.code === 'Space') { e.preventDefault(); $('pause').click(); } });

camera.position.copy(camP); renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (started && S) {
    if (!paused) { lt += dt; if (lt > dur(li)) { if (li < S.lines.length - 1) showLine(li + 1); else if (auto && si < SC.length - 1) { endT += dt; if (endT > 1.8) goScene(si + 1); } } }
    $('barf').style.width = (((si + (li + Math.min(1, lt / dur(li))) / S.lines.length) / SC.length) * 100) + '%'; if (!paused) S.update(dt, t, cur); tick(dt); updateParticles(dt);
    if (cur.orbit) { cur.oa += dt * .12; const r = Math.hypot(camPT.x, camPT.z), a0 = Math.atan2(camPT.x, camPT.z); camera.position.lerp(new V3(Math.sin(a0 + cur.oa) * r, camPT.y, Math.cos(a0 + cur.oa) * r), Math.min(1, dt * 3)); } else camera.position.lerp(camPT, Math.min(1, dt * 2.5));
    camL.lerp(camLT, Math.min(1, dt * 3)); camera.lookAt(camL);
  } else { camera.position.set(Math.sin(t * .2) * 3, 3, 15); camera.lookAt(0, 2, 0); }
  composer.render();
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
</script>
